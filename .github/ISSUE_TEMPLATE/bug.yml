name: Bug
description: Something does not work as documented / Algo não funciona como documentado
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before opening, check [docs/TROUBLESHOOTING.md](https://github.com/fortmea/docker-rosemary/blob/main/docs/TROUBLESHOOTING.md) and the existing issues. English or Portuguese are both fine.
        **Do not paste passwords, tokens or personal data** in the logs.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened. Include the exact command and error message.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone
      description: "Output of `getprop ro.product.device` and model"
      placeholder: rosemary (Redmi Note 10S)
    validations:
      required: true
  - type: input
    id: rom
    attributes:
      label: ROM and version
      description: "E.g. LineageOS 24 nightly 20261104 (`getprop ro.lineage.version`)"
    validations:
      required: true
  - type: input
    id: root
    attributes:
      label: Root manager and version
      placeholder: Magisk 31.1
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Module version
      description: "`grep version /data/adb/modules/docker/module.prop`"
      placeholder: 29.10.0-4
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Kernel
      description: "`uname -r`"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics
      description: Output of the commands below (as root).
      render: text
      value: |
        # dockerctl status
        # dockerctl logs 50
        # tail -20 /data/docker/log/uidfw.log
        # ip rule show | grep -E '^60(89|10[12]):'
        # cat /data/docker/resolv.conf
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: More context
      description: compose.yaml used (no secrets), daemon.json changes, other network/VPN/firewall Magisk modules installed, etc.
