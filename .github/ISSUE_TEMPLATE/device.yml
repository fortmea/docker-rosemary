name: Other phone report
description: It worked (or not) on a phone other than rosemary / Relato de outro aparelho
labels: [device-report]
body:
  - type: input
    id: device
    attributes:
      label: Phone and codename
    validations:
      required: true
  - type: input
    id: rom
    attributes:
      label: ROM, Android version and kernel (`uname -r`)
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works without changes
        - Works with a custom kernel
        - Does not work
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What had to change, what failed, relevant logs.
