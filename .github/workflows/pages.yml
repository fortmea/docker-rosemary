name: Pages

# Homepage + MMRL repository (json/modules.json) on GitHub Pages.
# Runs on homepage/changelog edits, by hand, and at the end of every release (release.yml).
on:
  push:
    branches: [main]
    paths: [site/**, scripts/build-site.py, CHANGELOG.md, .github/workflows/pages.yml]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build-site.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
